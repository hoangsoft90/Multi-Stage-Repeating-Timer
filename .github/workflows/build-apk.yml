name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (JDK 17 — required for Expo SDK 52+ / RN 0.7x+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (accepts licenses + build-tools)
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native project (expo prebuild --clean)
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

      # Debug APK = dev client (expo-dev-client) — connects to Metro for JS.
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # Release APK bundles the JS + signs with the template debug keystore —
      # installable standalone, real ads work.
      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      # Play Store AAB — signed with the REAL upload keystore (with-release-
      # signing config plugin reads android/key.properties; the keystore itself
      # is decoded from a GitHub secret, never committed).
      - name: Decode upload keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/looptimer-upload.jks
          cat > android/key.properties <<EOF
          storeFile=looptimer-upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build Release AAB (Play Store)
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: looptimer-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: looptimer-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
